workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages: [validate]

hardware-docs:
  stage: validate
  image: alpine:3.20
  script:
    - test -f README.md
    - test -f CLAUDE.md
    - test ! -e Makefile
    - find . -type f -name '*.md' -print0 | xargs -0 -r grep -n '[^[:ascii:]]' >/dev/null || true
